<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultat - Calculateur CO2</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            color: #1b4332;
            margin-top: 0;
        }

        .result-box {
            background-color: #e8f5e9;
            border-left: 4px solid #2d6a4f;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .result-number {
            font-size: 2rem;
            font-weight: 700;
            color: #2d6a4f;
            margin: 10px 0;
        }

        .details {
            color: #555;
            font-size: 0.95rem;
        }

        a {
            text-decoration: none;
        }

        button {
            width: 100%;
            background-color: #2d6a4f;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #1b4332;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 Résultat de votre trajet</h1>

        <p class="details">Pour un trajet de <strong>{{ distance }} km</strong> en <strong>{{ transport }}</strong> :</p>

        <div class="result-box">
            <div>Émission estimée</div>
            <div class="result-number">{{ total }} kg</div>
            <div>de CO₂</div>
        </div>

        <a href="/">
            <button>Nouveau calcul</button>
        </a>
    </div>

</body>
</html>
